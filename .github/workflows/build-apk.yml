
name: JARVIS NOVA ULTRA APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Check ZIP File
        run: |
          ls -la
          test -f JARVIS_NOVA_ULTRA_FINAL.zip

      - name: Extract Android Project
        run: |
          mkdir project
          unzip -q JARVIS_NOVA_ULTRA_FINAL.zip -d project
          ls -la project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JARVIS NOVA
        run: |
          gradle -p project --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-NOVA-ULTRA-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
